name: Build

on: [push]

jobs:
  build-ubuntu:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install dependencies
        uses: awalsh128/cache-apt-pkgs-action@v1.6.3
        with:
          packages: cmake g++ libncurses-dev
          version: 1.0
      - name: Build
        uses: threeal/cmake-action@v2.1.0

  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Build
        uses: threeal/cmake-action@v2.1.0
